name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [ ricksVibe ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create stub Storybook
        run: |
          mkdir -p storybook-static
          echo "<!doctype html><html><body><h1>Stub Storybook</h1><p>Deployed to GitHub Pages</p></body></html>" > storybook-static/index.html

      - name: Upload artifact for GitHub Pages
        # use v3 here to avoid pulling deprecated upload-artifact v3
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
